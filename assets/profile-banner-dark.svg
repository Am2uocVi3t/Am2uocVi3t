<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc"><title id="title">Huynh Quoc Viet | AI Research Terminal</title>
 <desc id="desc">AI Researcher, Machine Learning Engineer, AI Tech Lead at SpeedyLabX. Verifiable AI Systems. Research, reproduce, evaluate.</desc>
 <defs>
