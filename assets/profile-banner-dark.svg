   <radialGradient id="aura"><stop offset="0" stop-color="#80ADFF" stop-opacity=".15"/><stop offset="1" stop-color="#80ADFF" stop-opacity="0"/></radialGradient>
   <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#183047" stroke-width="1"/></pattern>
