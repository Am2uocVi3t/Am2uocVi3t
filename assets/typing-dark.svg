<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="106" viewBox="0 0 1200 106" role="img" aria-labelledby="title desc"><title id="title">Animated research slogans</title>
 <desc id="desc">Research, reproduce, evaluate. Building verifiable AI systems. Beyond accuracy, toward trustworthy AI. From research questions to evaluated systems.</desc>
 <style>
  text{font-family:'DejaVu Sans Mono',Menlo,Consolas,monospace}
  .line{animation:phase 20s steps(1,end) infinite}
  .window{animation-duration:20s;animation-timing-function:steps(45,end);animation-iteration-count:infinite}
  .caret{animation-duration:20s;animation-timing-function:steps(45,end);animation-iteration-count:infinite}
  .phase0{animation-delay:0s} .phase1{animation-delay:-15s} .phase2{animation-delay:-10s} .phase3{animation-delay:-5s}
  @keyframes phase{0%,24.99%{opacity:1}25%,100%{opacity:0}}
  .window0{animation-name:type0} .caret0{animation-name:caret0} @keyframes type0{0%{width:0}17%,23.99%{width:449px}24%,100%{width:0}} @keyframes caret0{0%{transform:translateX(0)}17%,23.99%{transform:translateX(449px)}24%,100%{transform:translateX(0)}} .window1{animation-name:type1} .caret1{animation-name:caret1} @keyframes type1{0%{width:0}17%,23.99%{width:434px}24%,100%{width:0}} @keyframes caret1{0%{transform:translateX(0)}17%,23.99%{transform:translateX(434px)}24%,100%{transform:translateX(0)}} .window2{animation-name:type2} .caret2{animation-name:caret2} @keyframes type2{0%{width:0}17%,23.99%{width:564px}24%,100%{width:0}} @keyframes caret2{0%{transform:translateX(0)}17%,23.99%{transform:translateX(564px)}24%,100%{transform:translateX(0)}} .window3{animation-name:type3} .caret3{animation-name:caret3} @keyframes type3{0%{width:0}17%,23.99%{width:651px}24%,100%{width:0}} @keyframes caret3{0%{transform:translateX(0)}17%,23.99%{transform:translateX(651px)}24%,100%{transform:translateX(0)}}
  @media(prefers-reduced-motion:reduce){.line,.window,.caret{animation:none!important}.line{opacity:0}.line.phase0{opacity:1}.window{width:1035px}.caret{display:none}}
 </style>
 <defs><clipPath id="type0"><rect class="window window0 phase0" x="85" y="42" width="1035" height="43"/></clipPath><clipPath id="type1"><rect class="window window1 phase1" x="85" y="42" width="1035" height="43"/></clipPath><clipPath id="type2"><rect class="window window2 phase2" x="85" y="42" width="1035" height="43"/></clipPath><clipPath id="type3"><rect class="window window3 phase3" x="85" y="42" width="1035" height="43"/></clipPath></defs>
 <rect x="1" y="1" width="1198" height="104" rx="16" fill="#101E2F" stroke="#274059" stroke-width="1.5"/>
 <rect x="1" y="1" width="5" height="104" rx="2" fill="#5DE0D0"/>
 <text x="27" y="31" fill="#92A8C1" font-size="13" letter-spacing="1.4">$ echo $RESEARCH_PHILOSOPHY</text>
 <text x="31" y="72" fill="#5DE0D0" font-size="26" font-weight="700">&gt;</text>
 <g class="line phase0" opacity="1"><text x="86" y="74" font-size="24" fill="#ECF7FF" clip-path="url(#type0)">Research → Reproduce → Evaluate</text><rect class="caret caret0 phase0" x="84" y="51" width="3" height="27" fill="#5DE0D0"/></g><g class="line phase1" opacity="0"><text x="86" y="74" font-size="24" fill="#ECF7FF" clip-path="url(#type1)">Building Verifiable AI Systems</text><rect class="caret caret1 phase1" x="84" y="51" width="3" height="27" fill="#5DE0D0"/></g><g class="line phase2" opacity="0"><text x="86" y="74" font-size="24" fill="#ECF7FF" clip-path="url(#type2)">Beyond Accuracy. Toward Trustworthy AI.</text><rect class="caret caret2 phase2" x="84" y="51" width="3" height="27" fill="#5DE0D0"/></g><g class="line phase3" opacity="0"><text x="86" y="74" font-size="24" fill="#ECF7FF" clip-path="url(#type3)">From research questions to evaluated systems.</text><rect class="caret caret3 phase3" x="84" y="51" width="3" height="27" fill="#5DE0D0"/></g><text x="1163" y="31" text-anchor="end" fill="#92A8C1" font-size="12">/ four-line loop</text></svg>